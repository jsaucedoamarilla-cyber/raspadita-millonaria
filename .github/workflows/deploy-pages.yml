name: Publicar paneles web
on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/**'
      - 'seller/**'
      - 'customer/**'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar páginas
        run: |
          mkdir -p dist/admin dist/seller dist/customer
          cp admin/index.html dist/admin/index.html
          cp seller/index.html dist/seller/index.html
          cp customer/index.html dist/customer/index.html
          touch dist/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar archivos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
