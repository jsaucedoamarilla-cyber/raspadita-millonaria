name: Compilar APK de la vendedora
on:
  workflow_dispatch:
  push:
    paths:
      - 'seller-app/**'
      - 'seller/**'
      - '.github/workflows/build-seller-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar Android SDK del servidor de compilación
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Sincronizar pantalla de vendedora
        run: cp seller/index.html seller-app/app/src/main/assets/seller.html
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
        working-directory: seller-app
      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Raspadita-Millonaria-Vendedora-APK
          path: seller-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
